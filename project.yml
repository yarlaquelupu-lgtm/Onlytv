# Alternativa reproducible con XcodeGen: xcodegen generate
name: OnlyTVMiusic
options:
  bundleIdPrefix: com.onlytvmiusic
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: '15.0'
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  OnlyTVMiusic:
    type: application
    platform: iOS
    sources:
      - path: OnlyTVMiusicIOS
        excludes:
          - Resources/**
          - Assets.xcassets/**
      - path: OnlyTVMiusicIOS/Assets.xcassets
      - path: OnlyTVMiusicIOS/Resources/premium
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onlytvmiusic.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
